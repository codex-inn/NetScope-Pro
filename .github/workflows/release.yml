name: Publish Windows release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --clean --noconfirm --onefile --collect-submodules uvicorn --collect-submodules apscheduler --collect-submodules fastapi --collect-submodules starlette --name NetScopePro run_desktop.py
      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path dist/NetScopePro.exe -DestinationPath NetScopePro-Windows.zip -Force
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: NetScopePro-Windows.zip
