name: Windows executable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "run_desktop.py"
      - "requirements.txt"
      - "build-windows.ps1"
      - ".github/workflows/windows-build.yml"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --clean --noconfirm --onefile --name NetScopePro run_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: NetScopePro-Windows
          path: dist/NetScopePro.exe
          if-no-files-found: error
          retention-days: 14
