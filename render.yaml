services:
  - type: web
    name: netscope-pro-scan-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_SCAN_TARGETS
        sync: false
      - key: CORS_ORIGINS
        value: https://codex-inn.github.io
